[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-rca"
version = "0.1.0"
description = "Pipeline Root-Cause Diagnosis Agent: automated root-cause tracing across a multi-layer data pipeline."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "faker>=30",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
